name: misa2

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ocr_risk2}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - misa2

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-ocr_risk2}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads2:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - misa2

  frontend:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - misa2

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data2:/data
      - caddy_config2:/config
    depends_on:
      - frontend
      - backend
    networks:
      - misa2
      - misa-api_default  # kết nối sang stack main để proxy quocbui.site

networks:
  misa2:
  misa-api_default:
    external: true  # network của main stack (đã chạy sẵn)

volumes:
  pgdata2:
  uploads2:
  caddy_data2:
  caddy_config2:
